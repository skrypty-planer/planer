name: Frontend CI

on:
  push:
    paths:
      - 'frontend/**'
      - 'ops/**'
  pull_request:
    paths:
      - 'frontend/**'
      - 'ops/**'
  workflow_dispatch:

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Frontend smoke test
        run: bash ops/frontend/smoke.sh
