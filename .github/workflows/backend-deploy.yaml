name: Backend Deploy (manual)

on:
  push:
    branches: [main ]
    paths:
      - 'backend/**'
      - 'ops/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trigger DEV deploy
        env:
          RENDER_BACKEND_DEV_HOOK: ${{ secrets.RENDER_BACKEND_DEV_HOOK }}
          ACTIONS_STEP_DEBUG: true
        run: bash ops/backend/deploy.sh